version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: autovision_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auto_image_processor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autovision_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autovision_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/auto_image_processor
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-secret-key-min-32-chars}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - STORAGE_PROVIDER=local
      - UPLOAD_DIR=/app/uploads
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: autovision_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/auto_image_processor
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/app/uploads
      - WORKER_CONCURRENCY=3
      # Add your API keys here:
      - REMOVE_BG_API_KEY=${REMOVE_BG_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PLATE_RECOGNIZER_API_KEY=${PLATE_RECOGNIZER_API_KEY:-}
      - GOOGLE_CLOUD_API_KEY=${GOOGLE_CLOUD_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
